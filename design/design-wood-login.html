<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧书城 · 管理后台登录</title>
<style>
  :root {
    --bg: #f2ede4;
    --bg-texture: #e8e0d4;
    --card-bg: #faf7f1;
    --text-primary: #2c2416;
    --text-secondary: #7a6e5e;
    --text-muted: #b0a494;
    --accent-green: #2d5a3d;
    --accent-green-hover: #1f422d;
    --accent-green-light: rgba(45,90,61,.06);
    --accent-wood: #b5956e;
    --border-light: #e5dcc8;
    --shadow: 0 8px 40px rgba(60,40,20,.06);
    --line-color: rgba(45,90,61,.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","Noto Serif SC","Noto Sans SC",serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* Subtle paper texture overlay */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.008) 2px,
        rgba(0,0,0,.008) 3px
      );
    pointer-events: none;
    z-index: 0;
  }

  /* ---- Background book line art ---- */
  .bg-books {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    opacity: .35;
  }
  .bg-books svg {
    position: absolute;
    width: 100%;
    height: 100%;
  }

  /* ---- Main container ---- */
  .container {
    position: relative;
    z-index: 1;
    display: flex;
    width: 100%;
    max-width: 900px;
    min-height: 500px;
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 12px 60px rgba(60,40,20,.08), 0 0 0 1px rgba(60,40,20,.04);
    overflow: hidden;
  }

  /* ---- Left quote panel ---- */
  .left-panel {
    width: 320px;
    flex-shrink: 0;
    background: linear-gradient(160deg, #2d5a3d 0%, #3a6b4a 40%, #4a7d5a 100%);
    padding: 52px 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  /* Wood grain overlay */
  .left-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        87deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,.03) 3px,
        rgba(0,0,0,.03) 4px
      ),
      repeating-linear-gradient(
        93deg,
        transparent,
        transparent 12px,
        rgba(0,0,0,.02) 12px,
        rgba(0,0,0,.02) 13px
      );
    opacity: .4;
    pointer-events: none;
  }
  .left-panel::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 80%, rgba(255,255,255,.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .quote-wrapper {
    position: relative;
    z-index: 1;
    text-align: center;
  }
  .quote-mark {
    font-size: 64px;
    font-family: "Georgia",serif;
    color: rgba(255,255,255,.08);
    line-height: 1;
    margin-bottom: -20px;
    text-align: left;
  }
  .quote-text {
    font-size: 22px;
    font-weight: 600;
    color: rgba(255,255,255,.9);
    line-height: 1.8;
    letter-spacing: 2px;
    font-family: "Noto Serif SC","SimSun","Songti SC",serif;
    margin-bottom: 18px;
  }
  .quote-author {
    font-size: 13px;
    color: rgba(255,255,255,.45);
    letter-spacing: 3px;
  }
  .quote-author::before {
    content: "—— ";
  }

  .brand-divider {
    width: 40px;
    height: 2px;
    background: rgba(255,255,255,.15);
    margin: 32px auto 24px;
    border-radius: 1px;
  }

  .brand-mini {
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .brand-mini-icon {
    font-size: 36px;
    margin-bottom: 8px;
  }
  .brand-mini-name {
    font-size: 18px;
    font-weight: 700;
    color: rgba(255,255,255,.85);
    letter-spacing: 4px;
  }
  .brand-mini-sub {
    font-size: 10px;
    color: rgba(255,255,255,.35);
    letter-spacing: 3px;
    margin-top: 4px;
  }

  /* Decorative line art on left panel bottom */
  .leaf-border {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 1;
    opacity: .12;
  }
  .leaf-border span {
    display: inline-block;
    margin: 0 4px;
    font-size: 16px;
    color: #fff;
  }

  /* ---- Right login panel ---- */
  .right-panel {
    flex: 1;
    padding: 48px 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: var(--card-bg);
    position: relative;
  }

  .right-panel h2 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .right-panel .greet {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 32px;
  }

  /* ---- Tabs (密码 / 验证码) ---- */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border-light);
  }
  .tab-btn {
    padding: 10px 24px 12px;
    border: none;
    background: none;
    font-size: 14px;
    cursor: pointer;
    color: var(--text-muted);
    font-family: inherit;
    position: relative;
    transition: color .2s;
  }
  .tab-btn.active {
    color: var(--accent-green);
    font-weight: 600;
  }
  .tab-btn.active::after {
    content: "";
    position: absolute;
    bottom: -1px;
    left: 20%;
    right: 20%;
    height: 2px;
    background: var(--accent-green);
    border-radius: 1px;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ---- Form ---- */
  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 7px;
    font-weight: 500;
    letter-spacing: .5px;
  }
  .input-wrap {
    display: flex;
    align-items: center;
    background: #f8f5ee;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 0 14px;
    transition: all .2s;
  }
  .input-wrap:focus-within {
    border-color: var(--accent-green);
    box-shadow: 0 0 0 3px rgba(45,90,61,.06);
    background: #fff;
  }
  .input-wrap svg {
    flex-shrink: 0;
    margin-right: 10px;
    opacity: .35;
    transition: opacity .2s;
  }
  .input-wrap:focus-within svg { opacity: .55; }
  .input-wrap input {
    flex: 1;
    border: none;
    background: none;
    padding: 12px 0;
    font-size: 14px;
    outline: none;
    color: var(--text-primary);
    font-family: inherit;
    min-width: 0;
  }
  .input-wrap input::placeholder { color: #c6bca8; }

  .input-row { display: flex; gap: 10px; }
  .input-row .input-wrap { flex: 1; }

  .sms-btn {
    flex-shrink: 0;
    padding: 10px 16px;
    background: var(--accent-green-light);
    border: 1px solid rgba(45,90,61,.12);
    border-radius: 10px;
    font-size: 12px;
    color: var(--accent-green);
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    font-weight: 500;
    transition: all .2s;
  }
  .sms-btn:hover { background: rgba(45,90,61,.1); border-color: rgba(45,90,61,.18); }

  .extra-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 26px;
    font-size: 13px;
  }
  .remember {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .remember input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent-green);
    cursor: pointer;
  }
  .forgot {
    color: var(--accent-green);
    text-decoration: none;
    cursor: pointer;
    font-size: 13px;
  }
  .forgot:hover { text-decoration: underline; }

  .login-btn {
    width: 100%;
    padding: 13px;
    background: var(--accent-green);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 3px;
    transition: all .2s;
    box-shadow: 0 4px 16px rgba(45,90,61,.15);
  }
  .login-btn:hover {
    background: var(--accent-green-hover);
    box-shadow: 0 6px 24px rgba(45,90,61,.25);
    transform: translateY(-1px);
  }

  .register-row {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .register-row a {
    color: var(--accent-green);
    text-decoration: none;
    font-weight: 500;
  }
  .register-row a:hover { text-decoration: underline; }

  /* ---- Responsive ---- */
  @media (max-width: 768px) {
    .container { flex-direction: column; max-width: 420px; }
    .left-panel {
      width: 100%;
      padding: 36px 28px;
      min-height: 200px;
    }
    .right-panel { padding: 32px 24px; }
    .quote-text { font-size: 18px; }
    .leaf-border { display: none; }
  }
</style>
</head>
<body>

<div class="bg-books">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <!-- Bookshelf line art stack -->
    <g stroke="#2d5a3d" stroke-width="1" fill="none" opacity=".2">
      <!-- Book stack 1 - bottom left -->
      <rect x="80" y="680" width="140" height="12" rx="1"/>
      <rect x="85" y="668" width="130" height="12" rx="1"/>
      <rect x="82" y="656" width="120" height="12" rx="1"/>
      <rect x="90" y="644" width="100" height="12" rx="1"/>

      <!-- Book stack 2 - mid right -->
      <rect x="1100" y="520" width="180" height="14" rx="1"/>
      <rect x="1090" y="506" width="160" height="14" rx="1"/>
      <rect x="1095" y="492" width="140" height="14" rx="1"/>
      <rect x="1108" y="478" width="120" height="14" rx="1"/>
      <rect x="1115" y="464" width="100" height="14" rx="1"/>

      <!-- Book stack 3 - top left -->
      <rect x="200" y="200" width="100" height="10" rx="1"/>
      <rect x="192" y="190" width="90" height="10" rx="1"/>
      <rect x="198" y="180" width="80" height="10" rx="1"/>

      <!-- Book stack 4 - right -->
      <rect x="1250" y="300" width="130" height="12" rx="1"/>
      <rect x="1240" y="288" width="120" height="12" rx="1"/>
      <rect x="1248" y="276" width="110" height="12" rx="1"/>

      <!-- Book stack 5 - center bottom -->
      <rect x="520" y="750" width="160" height="16" rx="1"/>
      <rect x="510" y="734" width="140" height="16" rx="1"/>
      <rect x="525" y="718" width="120" height="16" rx="1"/>

      <!-- Bookshelf shelf lines -->
      <line x1="60" y1="695" x2="240" y2="695" stroke-width="1.5"/>
      <line x1="1070" y1="538" x2="1300" y2="538" stroke-width="1.5"/>
      <line x1="490" y1="770" x2="700" y2="770" stroke-width="1.5"/>

      <!-- Tilted books -->
      <rect x="160" y="645" width="10" height="46" rx="1" transform="rotate(15 165 668)"/>
      <rect x="1150" y="470" width="10" height="52" rx="1" transform="rotate(-8 1155 496)"/>
      <rect x="230" y="185" width="8" height="38" rx="1" transform="rotate(20 234 204)"/>

      <!-- Scattered small dots (like dust motes) -->
      <circle cx="320" cy="420" r="1.5"/>
      <circle cx="760" cy="280" r="1"/>
      <circle cx="950" cy="600" r="1.5"/>
      <circle cx="180" cy="380" r="1"/>
      <circle cx="600" cy="400" r="1.2"/>
      <circle cx="1000" cy="200" r="1"/>
      <circle cx="400" cy="550" r="1.5"/>
    </g>
  </svg>
</div>

<div class="container">
  <!-- Left: Quote panel -->
  <div class="left-panel">
    <div class="quote-wrapper">
      <div class="quote-mark">"</div>
      <div class="quote-text">
        书籍是人类<br>进步的阶梯
      </div>
      <div class="quote-author">高尔基</div>
    </div>

    <div class="brand-divider"></div>

    <div class="brand-mini">
      <div class="brand-mini-icon">📚</div>
      <div class="brand-mini-name">智慧书城</div>
      <div class="brand-mini-sub">图书管理系统 · 后台</div>
    </div>

    <div class="leaf-border">
      <span>✦</span>
    </div>
  </div>

  <!-- Right: Login form -->
  <div class="right-panel">
    <h2>管理员登录</h2>
    <p class="greet">欢迎使用智慧书城图书管理系统</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-pwd">密码登录</button>
      <button class="tab-btn" data-tab="tab-sms">验证码</button>
    </div>

    <div class="tab-content active" id="tab-pwd">
      <div class="form-group">
        <label>账号</label>
        <div class="input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a6e5e" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          <input type="text" placeholder="管理员账号 / 手机号">
        </div>
      </div>
      <div class="form-group">
        <label>密码</label>
        <div class="input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a6e5e" stroke-width="1.6"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <input type="password" placeholder="请输入密码">
        </div>
      </div>
      <div class="extra-row">
        <label class="remember">
          <input type="checkbox" checked> 记住登录状态
        </label>
        <a class="forgot">忘记密码？</a>
      </div>
      <button class="login-btn">登 录</button>
    </div>

    <div class="tab-content" id="tab-sms">
      <div class="form-group">
        <label>手机号</label>
        <div class="input-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a6e5e" stroke-width="1.6"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
          <input type="text" placeholder="管理员手机号">
        </div>
      </div>
      <div class="form-group">
        <label>验证码</label>
        <div class="input-row">
          <div class="input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a6e5e" stroke-width="1.6"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="text" placeholder="输入验证码">
          </div>
          <button class="sms-btn">获取验证码</button>
        </div>
      </div>
      <button class="login-btn" style="margin-top: 4px;">登 录</button>
    </div>

    <div class="register-row">
      还没有管理账号？<a>申请开通</a>
    </div>
  </div>
</div>

<script>
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));
      document.getElementById(btn.dataset.tab).classList.add("active");
    });
  });
</script>
</body>
</html>
